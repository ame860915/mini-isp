name: ci
on: [push, pull_request]
jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pyyaml matplotlib pytest ruff
      - run: ruff check .
      - run: make test
      - run: make verify   # fails if any stage exceeds its C-vs-Python tolerance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: out/verify
