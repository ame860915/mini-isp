[project]
name = "mini-isp"
version = "0.1.0"
description = "RAW-to-RGB ISP: Python floating-point reference + fixed-point C model, verified stage by stage"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
raw = ["rawpy"]
iq = ["scikit-image", "colour-science"]

[tool.pytest.ini_options]
pythonpath = ["python_ref", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]  # scripts add python_ref to sys.path before importing

[tool.setuptools.packages.find]
where = ["python_ref"]
